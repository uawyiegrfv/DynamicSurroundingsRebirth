# Gradle-launching JDK is newer (this machine runs the wrapper on JDK 25).
org.gradle.java.installations.paths=D:\\minecraft\\zulu17.66.19-ca-jdk17.0.19-win_x64

# Minecraft/Forge
minecraft_version=1.20.1
forge_version=47.4.23

# Mod properties
mod_id=dsurround
mod_version=1.3.1
maven_group=org.orecruncher

# Dependencies
cloth_version=11.1.136
